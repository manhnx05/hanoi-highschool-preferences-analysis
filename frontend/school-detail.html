<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết trường - Tuyển sinh THPT Hà Nội 2024</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <style>
    .detail-hero {
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-card) 100%);
      padding: 60px 0 40px;
      border-bottom: 1px solid var(--border);
    }
    .school-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .school-badge {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: var(--gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #fff;
      box-shadow: 0 8px 24px var(--glow-blue);
      flex-shrink: 0;
    }
    .school-title-section h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .tier-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 32px;
    }
    .stat-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      transition: var(--transition);
    }
    .stat-box:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }
    .stat-box-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin: 0 auto 12px;
    }
    .stat-box-value {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .stat-box-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .info-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 24px;
    }
    .info-card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
    }
    .rank-label {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .rank-value {
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
    }
    .similar-school {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      cursor: pointer;
      transition: var(--transition);
    }
    .similar-school:hover {
      background: var(--bg-card2);
      border-color: var(--accent);
      transform: translateX(4px);
    }
    .comparison-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .comparison-label {
      min-width: 120px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .comparison-track {
      flex: 1;
      height: 32px;
      background: var(--bg);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }
    .comparison-fill {
      height: 100%;
      background: var(--gradient);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      transition: width 1s ease;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top" id="mainNav">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
      <div class="brand-icon"><i class="fa-solid fa-chart-pie"></i></div>
      <span class="brand-text">EduData <span class="brand-accent">Analytics</span></span>
    </a>
    <div class="navbar-nav ms-auto flex-row gap-2">
      <a class="nav-link px-3" href="index.html"><i class="fa-solid fa-house me-1"></i>Trang chủ</a>
      <a class="nav-link px-3" href="rankings.html"><i class="fa-solid fa-ranking-star me-1"></i>Xếp hạng</a>
      <a class="nav-link px-3" href="compare.html"><i class="fa-solid fa-code-compare me-1"></i>So sánh</a>
      <a class="nav-link px-3" href="advanced-analytics.html"><i class="fa-solid fa-chart-line me-1"></i>Phân tích</a>
      <button class="btn btn-sm btn-outline-light ms-2" id="themeToggle">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
  </div>
</nav>

<!-- Detail Hero -->
<section class="detail-hero">
  <div class="container-fluid px-4">
    <div id="schoolHeader">
      <div class="text-center py-5">
        <div class="loading-spinner"></div>
      </div>
    </div>
  </div>
</section>

<!-- Stats & Info -->
<section style="padding: 50px 0;">
  <div class="container-fluid px-4">
    <div class="row g-4">
      <!-- Main Stats -->
      <div class="col-lg-8">
        <div id="mainStats"></div>
        
        <div class="info-card" data-aos="fade-up">
          <h3 class="info-card-title">
            <i class="fa-solid fa-chart-pie text-primary"></i>
            Phân bố Nguyện vọng
          </h3>
          <canvas id="nvChart" height="200"></canvas>
        </div>

        <div class="info-card" data-aos="fade-up">
          <h3 class="info-card-title">
            <i class="fa-solid fa-scale-balanced text-warning"></i>
            So sánh với Trung bình Thành phố
          </h3>
          <div id="comparisonBars"></div>
        </div>

        <div class="info-card" data-aos="fade-up">
          <h3 class="info-card-title">
            <i class="fa-solid fa-school text-success"></i>
            Trường tương tự (theo tỷ lệ chọi)
          </h3>
          <div id="similarSchools"></div>
        </div>
      </div>

      <!-- Sidebar -->
      <div class="col-lg-4">
        <div class="info-card" data-aos="fade-up">
          <h3 class="info-card-title">
            <i class="fa-solid fa-trophy text-gold"></i>
            Thứ hạng
          </h3>
          <div id="rankings"></div>
        </div>

        <div class="info-card" data-aos="fade-up">
          <h3 class="info-card-title">
            <i class="fa-solid fa-chart-line text-purple"></i>
            Thống kê
          </h3>
          <div id="statistics"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="main-footer">
  <div class="container-fluid px-4">
    <div class="row align-items-center">
      <div class="col-md-6">
        <span class="brand-text"><span class="brand-accent">EduData</span> Analytics</span>
        <p class="footer-sub mt-1">Phân tích dữ liệu tuyển sinh THPT Hà Nội 2024–2025</p>
      </div>
      <div class="col-md-6 text-md-end">
        <p class="footer-sub">Data source: Sở GD&ĐT Hà Nội</p>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
const API = 'http://127.0.0.1:8000';
let schoolData = null;

document.addEventListener('DOMContentLoaded', () => {
  AOS.init({ duration: 700, once: true });
  setupThemeToggle();
  
  const params = new URLSearchParams(window.location.search);
  const schoolId = params.get('id');
  
  if (schoolId) {
    loadSchoolDetail(schoolId);
  } else {
    document.getElementById('schoolHeader').innerHTML = 
      '<div class="alert alert-warning">Không tìm thấy ID trường</div>';
  }
});

async function loadSchoolDetail(id) {
  try {
    const res = await fetch(`${API}/api/school-detail/${id}`);
    schoolData = await res.json();
    renderSchoolDetail();
  } catch (e) {
    document.getElementById('schoolHeader').innerHTML = 
      '<div class="alert alert-danger">Không thể tải dữ liệu trường</div>';
  }
}

function renderSchoolDetail() {
  const { school, statistics, rankings, nv_distribution, similar_schools, city_comparison } = schoolData;
  
  // Header
  document.getElementById('schoolHeader').innerHTML = `
    <div class="school-header">
      <div class="school-badge">🏫</div>
      <div class="school-title-section">
        <h1>${school.name}</h1>
        <div>
          <span class="tier-badge" style="background:${statistics.tier_color}">
            ${statistics.tier}
          </span>
          <span class="ms-2 text-muted">Mã: ${school.tt}</span>
        </div>
      </div>
    </div>
  `;

  // Main Stats
  document.getElementById('mainStats').innerHTML = `
    <div class="stat-grid">
      <div class="stat-box" data-aos="fade-up" data-aos-delay="0">
        <div class="stat-box-icon" style="background:rgba(239,68,68,0.15);color:#ef4444">
          <i class="fa-solid fa-fire"></i>
        </div>
        <div class="stat-box-value">${school.ratio.toFixed(2)}</div>
        <div class="stat-box-label">Tỷ lệ chọi</div>
      </div>
      <div class="stat-box" data-aos="fade-up" data-aos-delay="80">
        <div class="stat-box-icon" style="background:rgba(59,130,246,0.15);color:#3b82f6">
          <i class="fa-solid fa-star"></i>
        </div>
        <div class="stat-box-value">${school.nv1.toLocaleString()}</div>
        <div class="stat-box-label">Nguyện vọng 1</div>
      </div>
      <div class="stat-box" data-aos="fade-up" data-aos-delay="160">
        <div class="stat-box-icon" style="background:rgba(16,185,129,0.15);color:#10b981">
          <i class="fa-solid fa-users"></i>
        </div>
        <div class="stat-box-value">${school.quota.toLocaleString()}</div>
        <div class="stat-box-label">Chỉ tiêu</div>
      </div>
      <div class="stat-box" data-aos="fade-up" data-aos-delay="240">
        <div class="stat-box-icon" style="background:rgba(139,92,246,0.15);color:#8b5cf6">
          <i class="fa-solid fa-file-lines"></i>
        </div>
        <div class="stat-box-value">${school.total.toLocaleString()}</div>
        <div class="stat-box-label">Tổng hồ sơ</div>
      </div>
    </div>
  `;

  // Rankings
  document.getElementById('rankings').innerHTML = `
    <div class="rank-item">
      <span class="rank-label"><i class="fa-solid fa-fire me-2"></i>Xếp hạng Tỷ lệ chọi</span>
      <span class="rank-value">#${rankings.by_ratio}</span>
    </div>
    <div class="rank-item">
      <span class="rank-label"><i class="fa-solid fa-star me-2"></i>Xếp hạng NV1</span>
      <span class="rank-value">#${rankings.by_nv1}</span>
    </div>
    <div class="rank-item">
      <span class="rank-label"><i class="fa-solid fa-users me-2"></i>Xếp hạng Chỉ tiêu</span>
      <span class="rank-value">#${rankings.by_quota}</span>
    </div>
    <div class="rank-item">
      <span class="rank-label"><i class="fa-solid fa-file-lines me-2"></i>Xếp hạng Tổng HS</span>
      <span class="rank-value">#${rankings.by_total}</span>
    </div>
  `;

  // Statistics
  document.getElementById('statistics').innerHTML = `
    <div class="rank-item">
      <span class="rank-label"><i class="fa-solid fa-percent me-2"></i>Phân vị</span>
      <span class="rank-value">${statistics.percentile}%</span>
    </div>
    <div class="rank-item">
      <span class="rank-label"><i class="fa-solid fa-chart-line me-2"></i>Z-Score</span>
      <span class="rank-value">${statistics.z_score}</span>
    </div>
    <div class="rank-item">
      <span class="rank-label"><i class="fa-solid fa-layer-group me-2"></i>NV1</span>
      <span class="rank-value">${nv_distribution.nv1_percent}%</span>
    </div>
    <div class="rank-item">
      <span class="rank-label"><i class="fa-solid fa-layer-group me-2"></i>NV2</span>
      <span class="rank-value">${nv_distribution.nv2_percent}%</span>
    </div>
    <div class="rank-item">
      <span class="rank-label"><i class="fa-solid fa-layer-group me-2"></i>NV3</span>
      <span class="rank-value">${nv_distribution.nv3_percent}%</span>
    </div>
  `;

  // NV Distribution Chart
  const ctx = document.getElementById('nvChart').getContext('2d');
  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['NV 1', 'NV 2', 'NV 3'],
      datasets: [{
        data: [school.nv1, school.nv2, school.nv3],
        backgroundColor: ['rgba(59,130,246,0.85)', 'rgba(16,185,129,0.85)', 'rgba(139,92,246,0.85)'],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--text') } },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.label}: ${ctx.raw.toLocaleString()} hồ sơ (${nv_distribution[`nv${ctx.dataIndex + 1}_percent`]}%)`
          }
        }
      }
    }
  });

  // Comparison Bars
  const comparisons = [
    { label: 'Tỷ lệ chọi', value: school.ratio, avg: city_comparison.avg_ratio, max: 4 },
    { label: 'Chỉ tiêu', value: school.quota, avg: city_comparison.avg_quota, max: 1000 },
    { label: 'NV1', value: school.nv1, avg: city_comparison.avg_nv1, max: 3000 }
  ];

  document.getElementById('comparisonBars').innerHTML = comparisons.map(c => {
    const schoolPercent = Math.min((c.value / c.max) * 100, 100);
    const avgPercent = Math.min((c.avg / c.max) * 100, 100);
    return `
      <div class="comparison-bar">
        <div class="comparison-label">${c.label}</div>
        <div class="comparison-track">
          <div class="comparison-fill" style="width:${schoolPercent}%">
            ${c.label === 'Tỷ lệ chọi' ? c.value.toFixed(2) : c.value.toLocaleString()}
          </div>
        </div>
        <div style="min-width:80px;font-size:0.85rem;color:var(--text-muted)">
          TB: ${c.label === 'Tỷ lệ chọi' ? c.avg.toFixed(2) : c.avg.toLocaleString()}
        </div>
      </div>
    `;
  }).join('');

  // Similar Schools
  document.getElementById('similarSchools').innerHTML = similar_schools.length > 0
    ? similar_schools.map(s => `
        <div class="similar-school" onclick="window.location.href='school-detail.html?id=${s.tt}'">
          <div>
            <div style="font-weight:600;margin-bottom:4px">${s.name}</div>
            <div style="font-size:0.85rem;color:var(--text-muted)">
              Tỷ lệ chọi: ${s.ratio.toFixed(2)}
            </div>
          </div>
          <i class="fa-solid fa-chevron-right" style="color:var(--text-muted)"></i>
        </div>
      `).join('')
    : '<p class="text-muted">Không có trường tương tự</p>';
}

function setupThemeToggle() {
  const btn = document.getElementById('themeToggle');
  let dark = true;
  btn.addEventListener('click', () => {
    dark = !dark;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    btn.innerHTML = dark ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
  });
}
</script>
</body>
</html>
